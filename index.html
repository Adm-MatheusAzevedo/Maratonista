<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Matheus Campeão - Final</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root {
    --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
    --dark-bg: #05070a;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    margin: 0;
    background: var(--dark-bg);
    font-family: 'Montserrat', sans-serif;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

.container {
    width: 100%;
    max-width: 400px;
    position: relative;
    z-index: 10;
    text-align: center;
}

.instruction {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 40px;
}

.lock-scene {
    width: 200px;
    height: 220px;
    margin: 0 auto;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none; /* Garante que o cadeado não intercepte o clique do botão */
}

.lock-container {
    position: relative;
    width: 130px;
    height: 110px;
    transition: all 1s ease-in-out 0.8s;
}

/* HASTE ARREDONDADA */
.lock-shackle {
    position: absolute;
    top: -55px;
    left: 18px;
    width: 94px;
    height: 100px;
    border: 14px solid #888;
    border-bottom: none;
    border-radius: 50px 50px 0 0;
    z-index: 1;
    transform-origin: 15% 100%;
    transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.lock-body {
    position: absolute;
    width: 130px;
    height: 110px;
    background: var(--gold-gradient);
    border-radius: 15px;
    z-index: 2;
    box-shadow: 0 15px 35px rgba(0,0,0,0.7);
    display: flex;
    justify-content: center;
    align-items: center;
}

.keyhole-container {
    width: 22px;
    height: 35px;
    background: #000;
    border-radius: 11px 11px 4px 4px;
}

/* ANIMAÇÕES */
.unlocked .lock-shackle { transform: translateY(-25px); }
.unlocked .lock-shackle.rotate { transform: translateY(-25px) rotate(-45deg); }
.unlocked .lock-container.fade-out { opacity: 0; transform: scale(0.8); filter: blur(15px); }

#celebrationArea {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.name {
    font-size: 34px;
    font-weight: 900;
    background: var(--gold-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.title {
    font-size: 16px;
    letter-spacing: 8px;
    margin-top: 10px;
}

/* BOTÃO CORRIGIDO PARA CHROME */
button {
    margin-top: 60px;
    background: transparent;
    border: 2px solid #bf953f;
    padding: 18px 50px;
    color: #bf953f;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 3px;
    cursor: pointer;
    border-radius: 50px;
    position: relative;
    z-index: 999; /* Máxima prioridade */
    animation: pulse 2s infinite;
    transition: 0.3s;
    font-family: 'Montserrat', sans-serif;
    display: inline-block;
}

button:hover {
    background: var(--gold-gradient);
    color: #000;
}

@keyframes pulse {
    0% { transform: scale(0.98); }
    70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(191, 149, 63, 0); }
    100% { transform: scale(0.98); }
}

canvas {
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 1;
}
</style>
</head>
<body>

<div class="container">
    <p class="instruction" id="instr">Somente um formando de elite pode abrir</p>

    <div class="lock-scene" id="scene">
        <div class="lock-container" id="lockGroup">
            <div class="lock-shackle" id="shackle"></div>
            <div class="lock-body">
                <div class="keyhole-container"></div>
            </div>
        </div>
        <div id="celebrationArea">
            <p class="name" id="nameText"></p>
            <p class="title" id="subText"></p>
        </div>
    </div>

    <button id="btn" onclick="unlock()">Desbloquear</button>
</div>

<canvas id="fireworks"></canvas>

<script>
function unlock() {
    // Esconde o botão e instrução imediatamente
    document.getElementById("btn").style.pointerEvents = "none";
    document.getElementById("btn").style.opacity = "0";
    document.getElementById("instr").style.opacity = "0";
    
    const shackle = document.getElementById("shackle");
    const lockGroup = document.getElementById("lockGroup");
    document.getElementById("scene").classList.add("unlocked");

    setTimeout(() => { shackle.classList.add("rotate"); }, 500);

    setTimeout(() => {
        lockGroup.classList.add("fade-out");
        document.getElementById("celebrationArea").style.display = "flex";
        startTyping();
    }, 1500);

    // Redirecionamento para o Google Photos [cite: 32]
    setTimeout(() => { 
        window.location.href = "https://photos.app.goo.gl/X2BrCCSC49GabLsU9"; 
    }, 6500);
}

function startTyping() {
    const nStr = "Parabéns, Matheus!";
    const sStr = "Campeão";
    let n = 0, s = 0;

    function typeN() {
        if (n < nStr.length) {
            document.getElementById("nameText").innerHTML += nStr.charAt(n);
            n++; setTimeout(typeN, 80);
        } else { typeS(); }
    }
    function typeS() {
        if (s < sStr.length) {
            document.getElementById("subText").innerHTML += sStr.charAt(s);
            s++; setTimeout(typeS, 100);
        } else { initFireworks(); }
    }
    typeN();
}

const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
let particles = [];

function initFireworks() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    setInterval(() => {
        createExplosion(Math.random() * canvas.width, Math.random() * canvas.height * 0.4);
    }, 400);
    draw();
}

function createExplosion(x, y) {
    const colors = ["#bf953f", "#fcf6ba", "#ffffff", "#d4af37"];
    for (let i = 0; i < 40; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.5) * 12,
            life: 1,
            color: colors[Math.floor(Math.random() * colors.length)]
        });
    }
}

function draw() {
    ctx.fillStyle = "rgba(5, 7, 10, 0.25)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= 0.01;
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill();
        if (p.life <= 0) particles.splice(i, 1);
    });
    requestAnimationFrame(draw);
}
</script>
</body>
</html>
